<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>タイマー</title>
<style>
:root{
  --bg:#101010; --fg:#f2f2f2; --sub:#a0a0a0; --panel:#1c1c1c; --line:#353535;
  --p3:#ff4b2b; --accent:#3d8bff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;
  display:flex;flex-direction:column;overflow:hidden}
#panel{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--sub);padding:8px 16px}
.seg button.on{background:var(--accent);color:#fff}
.fields{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.fields[hidden]{display:none}
label{display:flex;gap:6px;align-items:center;font-size:15px}
input.dur{width:6.5em;background:#000;color:var(--fg);border:1px solid var(--line);border-radius:6px;
  padding:6px 8px;font-size:16px;font-variant-numeric:tabular-nums}
input.dur::placeholder{color:#666}
input:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
button{font:inherit;font-size:15px;background:#2a2a2a;color:var(--fg);border:1px solid var(--line);
  border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
button:hover{filter:brightness(1.2)}
button:disabled{opacity:.4;cursor:default;filter:none}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:6em}
#msg{min-height:1.2em;margin-top:6px;font-size:14px;color:#ff9f1a}
#disp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px;user-select:none;min-height:0}
#label{font-size:min(6vw,7vh);color:var(--sub);letter-spacing:.05em}
#big{font-size:min(24vw,48vh);line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums;
  white-space:nowrap}
#big.long{font-size:min(17vw,44vh)}
#sub{font-size:min(4.5vw,5.5vh);color:var(--sub);font-variant-numeric:tabular-nums;margin-top:.3em}
#marks{display:flex;flex-wrap:wrap;justify-content:center;gap:.3em 1.2em;margin-top:.4em;font-size:min(4vw,5vh);font-variant-numeric:tabular-nums}
#marks span{color:var(--sub);white-space:nowrap}
#marks span.done{color:var(--fg)}
body[data-phase="3"] #big, body[data-phase="3"] #label{color:var(--p3)}
footer{font-size:11px;color:#777;padding:3px 10px;border-top:1px solid var(--line);background:var(--panel)}
footer a{color:#777;white-space:nowrap}
body.fs #panel, body.fs footer{display:none}
</style>
</head>
<body data-phase="0">
<header id="panel">
  <div class="row">
    <div class="seg">
      <button id="m-exam">試験</button>
      <button id="m-talk">講演</button>
    </div>
    <div class="seg">
      <button id="d-down">カウントダウン</button>
      <button id="d-up">カウントアップ</button>
    </div>
    <div id="f-exam" class="fields">
      <label>試験時間 <input class="dur" id="examDur" placeholder="例 60"></label>
    </div>
    <div id="f-talk" class="fields" hidden>
      <label>予鈴(1鈴) <input class="dur" id="t1" placeholder="例 12"></label>
      <label>発表終了(2鈴) <input class="dur" id="t2" placeholder="例 15"></label>
      <label>質疑終了(3鈴) <input class="dur" id="t3" placeholder="例 20"></label>
    </div>
    <div class="btns">
      <button id="startBtn" class="primary">開始</button>
      <button id="resetBtn" disabled>リセット</button>
      <button id="nextBtn" disabled hidden>次の発表者</button>
      <button id="testBtn">鈴テスト</button>
      <button id="fsBtn">全画面</button>
    </div>
  </div>
  <div id="msg" role="status">時間は「分」または「分:秒」で入力(例 12、12:30)。</div>
</header>
<main id="disp" title="ダブルクリックで全画面の切り替え">
  <div id="label"></div>
  <div id="big"></div>
  <div id="sub"></div>
  <div id="marks"></div>
</main>
<footer>タイマー — 試験と講演の時間を計ります。単一 HTML、データはどこにも送信されません。MIT License, Copyright (c) 2026 Kouta Sekine. <a href="https://sapp.jp" target="_blank" rel="noopener">S Apps</a></footer>
<script>
"use strict";
const $ = id => document.getElementById(id);
const EXAM_BELLS = 1;          // 試験終了時に鳴らす回数
const STORE = "lecture-timer-v2";
const BELL = ["", "予鈴(1鈴)", "発表終了(2鈴)", "質疑終了(3鈴)"];  // 講演モードの鈴の呼び名
const HINT = "時間は「分」または「分:秒」で入力(例 12、12:30)。";

/* ---------- 鈴の音(WebAudio で合成。外部ファイル不要) ---------- */
let ctx = null, master = null;
function audio(){
  if(!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    master = ctx.createGain(); master.gain.value = 0.6;
    master.connect(comp); comp.connect(ctx.destination);
  }
  if(ctx.state === "suspended") ctx.resume();
  return ctx;
}
const F0 = 1320, GAP = 0.5;   // 基音[Hz]、打ち間隔[s]
const PARTIALS = [[1,1,1.8],[2.32,.45,1.0],[4.25,.22,.55],[6.63,.10,.30]]; // 倍率, 振幅, 減衰[s]
function strike(t){
  for(const [r,a,d] of PARTIALS){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = F0*r;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(a*0.35, t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t+d);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+d+0.05);
  }
}
function ring(n){
  audio();
  const t0 = ctx.currentTime + 0.05;
  for(let i=0;i<n;i++) strike(t0 + i*GAP);
}

/* ---------- 時間の解釈と表示 ---------- */
const pad = n => String(n).padStart(2,"0");
// "12" → 12 分、"12:30" → 12 分 30 秒。戻り値はミリ秒、不正なら null
function parseDur(v){
  v = v.trim().replace(/[０-９：]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  let m;
  if((m = v.match(/^(\d+)$/))) return +m[1]*60000;
  if((m = v.match(/^(\d+):([0-5]?\d)$/))) return (+m[1]*60 + +m[2])*1000;
  return null;
}
function fmtDur(sec){
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
const fmtSet = ms => fmtDur(Math.round(ms/1000));

/* ---------- 状態 ---------- */
// state: "idle" 開始前 / "run" 計時中 / "pause" 一時停止
let mode = "exam", dir = "down", state = "idle";
let acc = 0, t0 = 0;           // 経過の積算[ms]、計時再開時刻(performance.now)
let targets = [];              // {at:経過ms, n:鳴らす回数, rung}
const elapsed = () => acc + (state === "run" ? performance.now() - t0 : 0);

function save(){
  try{ localStorage.setItem(STORE, JSON.stringify({ mode, dir,
    examDur:$("examDur").value, t1:$("t1").value, t2:$("t2").value, t3:$("t3").value })); }catch(e){}
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE) || "null");
    if(s){ mode = s.mode === "talk" ? "talk" : "exam"; dir = s.dir === "up" ? "up" : "down";
      for(const k of ["examDur","t1","t2","t3"]) if(s[k]) $(k).value = s[k]; }
  }catch(e){}
}
function msg(s){ $("msg").textContent = s; }

// 入力から鈴の一覧を作る。不正なら null(msg にエラー)
function buildTargets(){
  if(mode === "exam"){
    const d = parseDur($("examDur").value);
    if(!d){ msg("試験時間を「分」または「分:秒」で入力してください。"); return null; }
    return [{at:d, n:EXAM_BELLS, rung:false}];
  }
  const ds = ["t1","t2","t3"].map(k => parseDur($(k).value));
  if(ds.some(d => !d)){ msg("予鈴(1鈴)・発表終了(2鈴)・質疑終了(3鈴)を「分」または「分:秒」で入力してください。"); return null; }
  if(!(ds[0] < ds[1] && ds[1] < ds[2])){ msg("予鈴(1鈴) < 発表終了(2鈴) < 質疑終了(3鈴) の順にしてください。"); return null; }
  return ds.map((d,i) => ({at:d, n:i+1, rung:false}));
}

function setMode(m){ if(state !== "idle") return; mode = m; msg(HINT); save(); syncUI(); render(); }
function setDir(d){ dir = d; save(); syncUI(); render(); }

function startPause(){
  audio();   // ユーザー操作の時点で音声を有効化しておく
  if(state === "idle"){
    const t = buildTargets(); if(!t) return;
    targets = t; acc = 0; msg(""); state = "run"; t0 = performance.now(); lockOn();
  }else if(state === "run"){
    acc = elapsed(); state = "pause"; lockOff();
  }else{
    state = "run"; t0 = performance.now(); lockOn();
  }
  save(); syncUI(); render();
}
function reset(){ state = "idle"; acc = 0; targets = []; lockOff(); msg(HINT); syncUI(); render(); }
// 講演モードのみ。同じ設定のまま 0 から計時し直す(リセット → 開始 を 1 回で行う)
function nextSpeaker(){ if(mode !== "talk" || state === "idle") return; reset(); startPause(); }

function syncUI(){
  $("m-exam").classList.toggle("on", mode==="exam");
  $("m-talk").classList.toggle("on", mode==="talk");
  $("d-down").classList.toggle("on", dir==="down");
  $("d-up").classList.toggle("on", dir==="up");
  $("f-exam").hidden = mode!=="exam";
  $("f-talk").hidden = mode!=="talk";
  $("startBtn").textContent = state==="idle" ? "開始" : state==="run" ? "一時停止" : "再開";
  $("resetBtn").disabled = state==="idle";
  $("nextBtn").hidden = mode!=="talk";
  $("nextBtn").disabled = state==="idle";
  const lock = state !== "idle";
  for(const id of ["m-exam","m-talk","examDur","t1","t2","t3"]) $(id).disabled = lock;
}

/* ---------- 毎フレーム処理 ---------- */
function tick(){
  if(state === "run"){
    const e = elapsed();
    // 未鳴動で時間を過ぎたもの。タブが長く止まっていて複数またいだ場合は最後の 1 つだけ鳴らす
    const due = targets.filter(x => !x.rung && x.at <= e);
    if(due.length){ due.forEach(x => x.rung = true); ring(due[due.length-1].n); }
  }
  render();
}

function render(){
  // 開始前は入力値から仮の一覧を作って表示だけする(エラー表示はしない)
  let tg = targets;
  if(state === "idle"){
    tg = [];
    if(mode === "exam"){ const d = parseDur($("examDur").value); if(d) tg = [{at:d, n:EXAM_BELLS, rung:false}]; }
    else{ tg = ["t1","t2","t3"].map((k,i) => ({at:parseDur($(k).value), n:i+1, rung:false})).filter(x => x.at); }
  }
  const e = elapsed();
  const done = tg.filter(x => x.rung).length;
  const last = tg[tg.length-1];
  // カウントダウンの表示対象は 発表終了(2鈴)から。予鈴(1鈴)は鳴らすが表示の対象にしない
  const next = tg.find(x => !x.rung && (mode === "exam" || x.n >= 2));
  let label = "", big = "", sub = "", phase = 0, marks = "";

  if(mode === "exam"){
    const finished = last && last.rung;
    if(finished){ label = "試験終了"; big = "終了"; phase = 3; }
    else{
      label = dir === "down" ? "残り時間" : "経過時間";
      big = !last ? "--:--"
          : dir === "down" ? fmtDur(Math.ceil((last.at - e)/1000)) : fmtDur(Math.floor(e/1000));
    }
    sub = last ? `試験時間 ${fmtSet(last.at)}` : "";
  }else{
    phase = done;
    if(dir === "down"){
      if(next){ label = `${BELL[next.n]}まで`; big = fmtDur(Math.ceil((next.at - e)/1000)); }
      else if(last){ label = `${BELL[3]}から超過`; big = "+" + fmtDur(Math.floor((e - last.at)/1000)); }
      else { label = "残り時間"; big = "--:--"; }
    }else{
      label = done === 3 ? `経過時間 ・ ${BELL[3]}を超過` : "経過時間";
      big = fmtDur(Math.floor(e/1000));
    }
    marks = tg.map(x => `<span class="${x.rung?"done":""}">${x.rung?"●":"○"} ${BELL[x.n]} ${fmtSet(x.at)}</span>`).join("");
  }
  if(state === "idle") label = "開始前 ・ " + label;
  if(state === "pause") label = "一時停止中 ・ " + label;

  document.body.dataset.phase = phase;
  $("label").textContent = label;
  $("big").textContent = big;
  $("big").classList.toggle("long", big.length > 5);
  $("sub").textContent = sub;
  $("marks").innerHTML = marks;
}

/* ---------- 画面のスリープ防止(対応ブラウザのみ) ---------- */
let wl = null;
async function lockOn(){
  try{ if("wakeLock" in navigator && !wl){ wl = await navigator.wakeLock.request("screen");
    wl.addEventListener("release", () => { wl = null; }); } }catch(e){ wl = null; }
}
function lockOff(){ try{ if(wl) wl.release(); }catch(e){} wl = null; }
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible"){ if(state === "run") lockOn(); tick(); }
});

/* ---------- 全画面 ---------- */
function toggleFs(){
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => msg("全画面にできませんでした。"));
}
document.addEventListener("fullscreenchange", () => {
  document.body.classList.toggle("fs", !!document.fullscreenElement);
});

/* ---------- 配線 ---------- */
$("m-exam").onclick = () => setMode("exam");
$("m-talk").onclick = () => setMode("talk");
$("d-down").onclick = () => setDir("down");
$("d-up").onclick = () => setDir("up");
$("startBtn").onclick = startPause;
$("resetBtn").onclick = reset;
$("nextBtn").onclick = nextSpeaker;
$("testBtn").onclick = () => ring(1);
$("fsBtn").onclick = toggleFs;
$("disp").addEventListener("dblclick", toggleFs);
for(const id of ["examDur","t1","t2","t3"]) $(id).addEventListener("input", () => { save(); render(); });

load(); syncUI(); render();
setInterval(tick, 200);
</script>
</body>
</html>
